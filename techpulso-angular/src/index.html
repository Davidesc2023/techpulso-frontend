<!doctype html>
<!--
  TechPulso - src/index.html (proyecto Angular)
  Politécnico Gran Colombiano - Módulo Front-End - Grupo B02 / Subgrupo 26

  Es la única página HTML real de la aplicación. Angular dibuja todo lo
  demás dentro de la etiqueta <app-root>, que corresponde al componente
  raíz (src/app/app.ts).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TechPulso</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!--
    Fuentes e íconos de TechPulso (cargados desde Google Fonts):
    - Material Symbols Outlined: los íconos de la interfaz (corazón, reloj, flechas, etc.).
    - Plus Jakarta Sans: la tipografía de todo el sitio, definida en tailwind.config.js.
    Se cargan una sola vez acá y quedan disponibles para toda la aplicación.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body>
  <!-- Punto donde Angular dibuja toda la aplicación -->
  <app-root></app-root>
</body>
</html>
