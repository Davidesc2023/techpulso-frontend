<!--
  TechPulso - app.html (plantilla del componente raíz)

  Estructura de toda la aplicación, de arriba hacia abajo:
  encabezado, contenido de la vista actual y pie de página. El aviso
  flotante (app-toast) está fijo en una esquina, así que su lugar en la
  plantilla no cambia lo que se ve.
-->

<!-- Encabezado (componente Header) -->
<app-header />

<!-- Espacio donde el router mostrará la vista de la ruta actual -->
<router-outlet />

<!-- Pie de página (componente Footer) -->
<app-footer />

<!-- Aviso flotante compartido por todas las vistas (componente Toast) -->
<app-toast />
